<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educatech Hub - O acervo definitivo para mentes brilhantes</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffc107;
            --text-color: #f5f5f5;
            --text-muted: #aaa;
            --badge-discount: #e53935;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid #333;
            background-color: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ffc107;
            object-fit: cover;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Abas de Navegação */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background-color: #161616;
            overflow-x: auto;
        }

        .tab-btn {
            background-color: #2b2b2b;
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Grade de Produtos */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            transition: transform 0.2s;
            border: 1px solid #2a2a2a;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--badge-discount);
            color: white;
            padding: 4px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            z-index: 2;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #333;
        }

        .card-body {
            padding: 15px;
        }

        .store-tag {
            font-size: 0.75rem;
            color: var(--accent-color);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .card-title {
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
        }

        .price-box {
            margin-bottom: 15px;
        }

        .old-price {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .current-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .buy-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--accent-color);
            color: #000;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="Educatech Hub Logo">
        <h1>Educatech Hub</h1>
        <p>O acervo definitivo para mentes brilhantes e estudantes performáticos.</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="filterCategory('todos', event)">🔥 Todos</button>
        <button class="tab-btn" onclick="filterCategory('recentes', event)">✨ Recentes</button>
        <button class="tab-btn" onclick="filterCategory('quentes', event)">⚡ Mais Quentes</button>
        <button class="tab-btn" onclick="filterCategory('xadrez', event)">♟️ Xadrez & Performance</button>
        <button class="tab-btn" onclick="filterCategory('papelaria', event)">📚 Papelaria Cult</button>
    </div>

    <div class="container">
        <!-- A grade carrega os produtos automaticamente do arquivo produtos.json -->
        <div class="grid" id="product-grid"></div>
    </div>
    
    <script>
        // Função para carregar os produtos do arquivo JSON e montar a página
        async function carregarProdutos() {
            try {
                const response = await fetch('produtos.json');
                const produtos = await response.json();
                
                const grid = document.getElementById('product-grid');
                grid.innerHTML = ''; // Limpa a grade

                produtos.forEach(prod => {
                    // Calcula a porcentagem de desconto automaticamente
                    const desconto = Math.round(((prod.precoAntigo - prod.precoAtual) / prod.precoAntigo) * 100);

                    // Formata os preços para o padrão brasileiro (R$ XX,XX)
                    const precoAntigoFormatado = prod.precoAntigo.toFixed(2).replace('.', ',');
                    const precoAtualFormatado = prod.precoAtual.toFixed(2).replace('.', ',');

                    // Cria o HTML do card dinamicamente
                    const cardHTML = `
                        <div class="card" data-category="${prod.categoria}">
                            <span class="badge">-${desconto}%</span>
                            <img src="${prod.imagem}" alt="${prod.titulo}">
                            <div class="card-body">
                                <span class="store-tag">Mercado Livre</span>
                                <h3 class="card-title">${prod.titulo}</h3>
                                <div class="price-box">
                                    <span class="old-price">R$ ${precoAntigoFormatado}</span>
                                    <div class="current-price">R$ ${precoAtualFormatado}</div>
                                </div>
                                <a href="${prod.link}" target="_blank" class="buy-fn buy-btn">Ver Oferta</a>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += cardHTML;
                });
            } catch (error) {
                console.error("Erro ao carregar os produtos:", error);
            }
        }

        // Executa assim que a página carrega
        window.onload = carregarProdutos;

        // Função de filtro por categoria
        function filterCategory(category, event) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const categories = card.getAttribute('data-category');
                if (category === 'todos' || categories.includes(category)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
