name: Atualizar Lista do Mercado Livre

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências e Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Executar o robô de sincronização
        run: python robo_lista.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "Robô do Educatech"
          git config --global user.email "robo@educatech.local"
          git add produtos.json
          git commit -m "auto: atualização diária da lista de afiliados do ML" || echo "Sem mudanças para commitar"
          git push