name: Atualizar Lista do Mercado Livre

on:
  schedule:
    # 07:00 America/Fortaleza (UTC-3)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Copiar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias e Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Executar o robo de sincronizacao
        env:
          PLAYWRIGHT_HEADLESS: "true"
        run: python robo_lista.py

      - name: Anexar screenshot de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-robo-${{ github.run_id }}
          path: erro_pagina.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar alteracoes no GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- produtos.json; then
            echo "Sem alteracoes em produtos.json; nada a commitar."
            exit 0
          fi
          git config user.name "Robo do Educatech"
          git config user.email "robo@educatech.local"
          git add produtos.json
          git commit -m "auto: atualizacao diaria da lista de afiliados do ML"
          git push
